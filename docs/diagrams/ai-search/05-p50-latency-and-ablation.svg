  <!-- detailed -->
  <text x="106" y="275" text-anchor="end" font-size="11" font-weight="600" fill="#334155" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">detailed</text>
  <rect x="114.0" y="256" width="25.8" height="13" rx="2" fill="#94a3b8"/>
