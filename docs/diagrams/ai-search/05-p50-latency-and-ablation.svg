<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992 404" width="992" height="404">
  <rect width="992" height="404" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="32" y="34" font-size="17.5" font-weight="700" fill="#0f172a" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">Iter3 检索端 P50 延迟优化与单变量消融实测</text>
  <text x="32" y="52" font-size="12" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">v2 检索端 P50 由 1561–1827ms 降至 119–156ms（-90.9% ~ -92.4%），精度与安全护栏 100% 零退化</text>

  <!-- Left Panel: P50 Latency Comparison -->
  <rect x="28" y="66" width="462" height="318" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="89" font-size="13.5" font-weight="700" fill="#1e293b" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">v2 检索端 P50 耗时对比（Iter1 vs Iter3）</text>
  <text x="474" y="89" text-anchor="end" font-size="11" fill="#059669" font-weight="600" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">全档远低于 &lt;=600ms 目标</text>

  <rect x="44" y="99" width="10" height="10" rx="2" fill="#94a3b8"/>
  <text x="58" y="108" font-size="10.5" fill="#334155" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">Iter1 召回</text>
