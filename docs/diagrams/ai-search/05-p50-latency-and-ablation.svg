  <line x1="288.0" y1="122" x2="288.0" y2="334" stroke="#e2e8f0" stroke-dasharray="3,3"/>
  <text x="288.0" y="350" text-anchor="middle" font-size="10" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">1200ms</text>
  <line x1="375.0" y1="122" x2="375.0" y2="334" stroke="#e2e8f0" stroke-dasharray="3,3"/>
  <text x="375.0" y="350" text-anchor="middle" font-size="10" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">1800ms</text>

  <!-- photo-only -->
  <text x="106" y="149" text-anchor="end" font-size="11" font-weight="600" fill="#334155" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">photo-only</text>
  <rect x="114.0" y="130" width="22.0" height="13" rx="2" fill="#94a3b8"/>
  <rect x="136.0" y="130" width="212.9" height="13" rx="2" fill="#f59e0b"/>
  <text x="354.0" y="140" font-size="10" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">1620ms</text>
