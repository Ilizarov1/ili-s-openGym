  <text x="136" y="108" font-size="10.5" fill="#334155" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">Rerank FP32</text>
  <rect x="216" y="99" width="10" height="10" rx="2" fill="#06b6d4"/>
  <text x="230" y="108" font-size="10.5" fill="#334155" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">text+增量vec</text>
  <rect x="318" y="99" width="10" height="10" rx="2" fill="#10b981"/>
  <text x="332" y="108" font-size="10.5" fill="#334155" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">Rerank FP16</text>

  <!-- Gridlines: x0=114, scale=0.145 px/ms (2000ms -> 404) -->
  <line x1="114.0" y1="122" x2="114.0" y2="334" stroke="#94a3b8"/>
