  <rect x="121.3" y="146" width="14.0" height="13" rx="2" fill="#10b981"/>
  <text x="141.0" y="156" font-size="10.5" font-weight="700" fill="#059669" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">147ms (-90.9%)</text>

  <!-- simple -->
  <text x="106" y="191" text-anchor="end" font-size="11" font-weight="600" fill="#334155" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">simple</text>
  <rect x="114.0" y="172" width="25.8" height="13" rx="2" fill="#94a3b8"/>
  <rect x="139.8" y="172" width="216.4" height="13" rx="2" fill="#f59e0b"/>
  <text x="361.2" y="182" font-size="10" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">1670ms</text>
  <rect x="114.0" y="188" width="7.8" height="13" rx="2" fill="#06b6d4"/>
  <rect x="121.8" y="188" width="13.8" height="13" rx="2" fill="#10b981"/>
  <text x="141.0" y="198" font-size="10.5" font-weight="700" fill="#059669" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">149ms (-91.1%)</text>

  <!-- alias -->
  <text x="106" y="233" text-anchor="end" font-size="11" font-weight="600" fill="#334155" font-family="PingFang SC, Microsoft YaHei, Segoe UI, -apple-system, sans-serif">alias</text>
  <rect x="114.0" y="214" width="27.1" height="13" rx="2" fill="#94a3b8"/>
  <rect x="141.1" y="214" width="215.6" height="13" rx="2" fill="#f59e0b"/>
