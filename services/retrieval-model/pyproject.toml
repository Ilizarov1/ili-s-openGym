[project]
name = "opengym-retrieval-model"
version = "0.1.0"
description = "Local embedding and reranking service for openGym retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sentence-transformers==4.1.0",
  "transformers==4.57.4",
  "safetensors==0.5.3",
  "huggingface-hub==0.36.2",
  "numpy==2.2.5",
]

[tool.uv]
managed = true

